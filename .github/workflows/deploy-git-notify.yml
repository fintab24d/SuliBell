name: Discord Git & Deploy Értesítés

on:
  push:
    branches:
      - '**'

jobs:
  notify-discord:
    name: Értesítés küldése Discordra (#🚀-deploy-és-git)
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Embed Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_SHA: ${{ github.event.head_commit.id }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("fs");
            const webhook = process.env.DISCORD_WEBHOOK;
            if (!webhook) process.exit(0);

            let evt = {};
            try {
              if (process.env.GITHUB_EVENT_PATH) {
                evt = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
              }
            } catch {}
            const commitCount = Array.isArray(evt.commits) ? evt.commits.length : 1;

            const msg = (process.env.COMMIT_MSG || "").trim();
            const firstLine = msg.split("\n")[0].slice(0, 200);
            const remaining = msg.split("\n").slice(1).join("\n").trim().slice(0, 800);
            const description = remaining ? `**${firstLine}**\n\n${remaining}` : `**${firstLine || "Új commit"}**`;

            const payload = {
              username: "GitHub SuliBell",
              avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              embeds: [
                {
                  title: "🚀 Új commit érkezett a GitHub repóba!",
                  url: process.env.COMMIT_URL || "https://github.com/" + process.env.REPO,
                  description: description,
                  color: 0x5865F2,
                  fields: [
                    {
                      name: "👤 Szerző",
                      value: process.env.COMMIT_AUTHOR || "Fejlesztő",
                      inline: true
                    },
                    {
                      name: "🌿 Ág (Branch)",
                      value: "`" + (process.env.BRANCH || "main") + "`",
                      inline: true
                    },
                    {
                      name: "🔖 Commit azonosító",
                      value: process.env.COMMIT_SHA ? `[\`${process.env.COMMIT_SHA.slice(0, 7)}\`](${process.env.COMMIT_URL})` : "N/A",
                      inline: true
                    },
                    {
                      name: "📦 Csomag mérete",
                      value: `${commitCount} commit`,
                      inline: true
                    }
                  ],
                  footer: {
                    text: `SuliBell • ${process.env.REPO || "fintab24d/SuliBell"}`
                  },
                  timestamp: new Date().toISOString()
                }
              ]
            };

            fetch(webhook, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            }).then(r => {
              if (!r.ok) {
                console.error("Discord webhook status:", r.status);
                process.exit(1);
              }
              console.log("Discord értesítés sikeresen elküldve!");
            }).catch(err => {
              console.error(err);
              process.exit(1);
            });
          '
